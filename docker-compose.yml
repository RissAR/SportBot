services:
  sportbot_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportbot_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    env_file:
      - path: .env
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
